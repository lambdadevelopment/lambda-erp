name: Tests

# Runs the ERP validation suite (full document cycle + GL/stock + atomicity
# regressions) on BOTH supported backends:
#   * in-memory SQLite — the fast default used by local dev
#   * PostgreSQL — the production backend, via a GitHub Actions service
#     container (an ephemeral postgres:16 Docker container the runner starts
#     alongside the job and tears down after; nothing managed/external).
# This is the guard that the accounting invariants hold on what we actually
# ship, not just on SQLite.
on:
  push:
    branches: [master]
    # Frontend changes run the tests too: the demo deploy waits for them.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "terraform/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "frontend/**"
      - "terraform/**"
  workflow_dispatch:

jobs:
  validation:
    name: Validation suite (SQLite + Postgres), part ${{ matrix.shard }} of 5
    runs-on: ubuntu-latest
    # The suites are split over five parallel jobs, each with its own
    # PostgreSQL (one job ran 145 steps in ~27 min). Every test step names the
    # part it runs in (`if: matrix.shard == N`), balanced by measured run time;
    # a new step needs an `if:` line too, or it runs in every part.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lambda_test
        ports:
          - 5432:5432
        # Hold the job until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (with the postgres extra)
        run: pip install -e ".[postgres]"

      - name: Direct ERP discovery and extension metadata
        if: matrix.shard == 3
        run: python -m tests.test_erp_context

      - name: LLM pricing and orchestrator request contract
        if: matrix.shard == 2
        run: python -m tests.test_llm_pricing

      - name: Utils — now() timezone-aware UTC (backend-agnostic)
        if: matrix.shard == 5
        run: python -m tests.test_utils_now

      - name: Company default sales tax settings — SQLite
        if: matrix.shard == 2
        run: python -m tests.test_company_tax_settings

      - name: Company default sales tax settings — PostgreSQL
        if: matrix.shard == 4
        env:
          LAMBDA_ERP_TEST_DB: postgresql://postgres:postgres@localhost:5432/lambda_test
        run: python -m tests.test_company_tax_settings

      - name: Validation suite — SQLite (in-memory)
        if: matrix.shard == 3
        run: python -m tests.test_erp_validation

      - name: Validation suite — PostgreSQL
        if: matrix.shard == 2
        env:
          LAMBDA_ERP_TEST_DB: postgresql://postgres:postgres@localhost:5432/lambda_test
        run: python -m tests.test_erp_validation

      - name: Pricing, external identity, cost centres and migrations — SQLite
        if: matrix.shard == 2
        run: python -m tests.test_pricing_integrity

      - name: Pricing, external identity, cost centres and migrations — PostgreSQL
